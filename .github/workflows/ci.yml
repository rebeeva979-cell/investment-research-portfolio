name: portfolio-ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation dependency
        run: python -m pip install -r requirements.txt
      - name: Rebuild from committed snapshots
        run: make build
      - name: Manifest, unit tests, site consistency
        run: make check
      - name: Verify Pages artifact
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          test -f docs/ethfi.html
          test -f docs/assets/Marina_Rebeeva_CV.pdf
